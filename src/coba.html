<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Image Modal dengan 6 Gambar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal-overlay {
      background-color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="bg-gray-100">

  <!-- 6 Button untuk membuka gambar -->
  <div class="flex flex-wrap gap-4 p-6 justify-center">
    <!-- Gambar 1 -->
    <button id="openModalBtn1" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 1
    </button>
    <!-- Gambar 2 -->
    <button id="openModalBtn2" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 2
    </button>
    <!-- Gambar 3 -->
    <button id="openModalBtn3" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 3
    </button>
    <!-- Gambar 4 -->
    <button id="openModalBtn4" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 4
    </button>
    <!-- Gambar 5 -->
    <button id="openModalBtn5" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 5
    </button>
    <!-- Gambar 6 -->
    <button id="openModalBtn6" class="px-6 py-3 bg-blue-500 text-white rounded-full hover:bg-blue-600 focus:outline-none">
      Gambar 6
    </button>
  </div>

  <!-- Modal -->
  <div id="imageModal" class="fixed inset-0 flex items-center justify-center hidden modal-overlay">
    <div class="bg-white p-4 rounded-lg shadow-lg max-w-3xl w-full relative">
      <button id="closeModalBtn" class="absolute top-0 right-0 p-2 text-gray-500 hover:text-gray-700 focus:outline-none">
        &times;
      </button>
      <img id="modalImage" src="" alt="Gambar Modal" class="max-w-full max-h-[80vh] object-contain mx-auto rounded-lg">
    </div>
  </div>

  <script>
    // Referensi tombol dan modal
    const openModalBtn1 = document.getElementById('openModalBtn1');
    const openModalBtn2 = document.getElementById('openModalBtn2');
    const openModalBtn3 = document.getElementById('openModalBtn3');
    const openModalBtn4 = document.getElementById('openModalBtn4');
    const openModalBtn5 = document.getElementById('openModalBtn5');
    const openModalBtn6 = document.getElementById('openModalBtn6');
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Fungsi untuk membuka modal dengan gambar tertentu
    const openModal = (imageUrl) => {
      modalImage.src = imageUrl;
      imageModal.classList.remove('hidden');
    };

    // Menangani klik tombol untuk membuka gambar
    openModalBtn1.addEventListener('click', () => openModal('/src/img/1.jpg'));
    openModalBtn2.addEventListener('click', () => openModal('https://via.placeholder.com/800x600?text=Gambar+2'));
    openModalBtn3.addEventListener('click', () => openModal('https://via.placeholder.com/800x600?text=Gambar+3'));
    openModalBtn4.addEventListener('click', () => openModal('https://via.placeholder.com/800x600?text=Gambar+4'));
    openModalBtn5.addEventListener('click', () => openModal('https://via.placeholder.com/800x600?text=Gambar+5'));
    openModalBtn6.addEventListener('click', () => openModal('https://via.placeholder.com/800x600?text=Gambar+6'));

    // Menangani klik untuk menutup modal
    closeModalBtn.addEventListener('click', () => {
      imageModal.classList.add('hidden');
    });

    // Menutup modal jika mengklik area luar modal
    window.addEventListener('click', (event) => {
      if (event.target === imageModal) {
        imageModal.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
